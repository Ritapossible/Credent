<!doctype html>
<!--
  No `data-theme` is stamped here on purpose. The tokens define light on bare
  `:root` and dark under `prefers-color-scheme`, so an unstamped document follows
  the operating system; stamping `light` would have made the media query
  unreachable and pinned every viewer to light. The toggle stamps the attribute
  on mount, and from then on it wins in both directions.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Credent — reputation-backed trust infrastructure for autonomous agents</title>
    <meta
      name="description"
      content="Credent turns agent reputation into economic trust. Attestations are graded in consensus on GenLayer; the resulting score sets how much collateral an agent must post."
    />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300..700&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
